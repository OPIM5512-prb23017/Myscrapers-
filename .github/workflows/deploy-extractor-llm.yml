name: Deploy LLM Extractor

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/604572311569/locations/global/workloadIdentityPools/github-pool/providers/gh-actions
          service_account: cf-deployer@project-5bf968d7-d2ed-4863-a7d.iam.gserviceaccount.com

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify authentication
        run: gcloud auth list
